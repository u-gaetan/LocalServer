<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🔬 Admin — Tracker ULaval</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { color: #60a5fa; margin-bottom: 5px; }
        .subtitle { color: #64748b; margin-bottom: 25px; font-size: 14px; }

        .auth-section {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .auth-section label { font-size: 14px; white-space: nowrap; }
        .auth-section input {
            flex: 1;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-family: monospace;
            font-size: 13px;
        }
        .auth-section button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .auth-section button:hover { background: #2563eb; }

        #statusBar {
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }
        .status-ok { background: #064e3b; color: #6ee7b7; display: block !important; }
        .status-err { background: #7f1d1d; color: #fca5a5; display: block !important; }
        .status-info { background: #1e3a5f; color: #93c5fd; display: block !important; }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #1e293b;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }
        .card .number { font-size: 32px; font-weight: bold; color: #60a5fa; }
        .card .label { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        .table-section {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .table-section h2 { font-size: 16px; margin-bottom: 12px; color: #f1f5f9; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left;
            padding: 10px;
            background: #334155;
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
        }
        td { padding: 10px; border-bottom: 1px solid #334155; }
        tr:hover { background: #334155; }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #22c55e; }
        .btn-gray { background: #64748b; }
        .btn:hover { opacity: 0.85; }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .actions button { padding: 12px 24px; font-size: 14px; }
        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

    <h1>🔬 Dashboard — Tracker ULaval</h1>
    <p class="subtitle">Interface d'administration pour les chercheurs</p>

    <div class="auth-section" id="loginSection">
        <label>👤</label>
        <input type="text" id="usernameInput" placeholder="Identifiant" autocomplete="username" />
        <label>🔒</label>
        <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password" />
        <button id="connectBtn">Connexer</button>
    </div>

    <!-- Affiché une fois connecté -->
    <div class="auth-section" id="loggedSection" style="display: none;">
        <label>Connecté en tant que <strong id="loggedUser"></strong></label>
        <button id="logoutBtn" class="btn btn-gray">Déconnexion</button>
    </div>


    <div id="statusBar"></div>

    <div id="mainContent" style="display: none;">
        <div class="summary-cards">
            <div class="card">
                <div class="number" id="totalParticipants">-</div>
                <div class="label">Participants</div>
            </div>
            <div class="card">
                <div class="number" id="totalSessions">-</div>
                <div class="label">Sessions</div>
            </div>
            <div class="card">
                <div class="number" id="totalEvents">-</div>
                <div class="label">Événements</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-green" id="downloadAllBtn">
                📥 Télécharger TOUTES les données (JSON)
            </button>
            <button class="btn btn-gray" id="refreshBtn">
                🔄 Rafraîchir
            </button>
        </div>

        <div class="table-section">
            <h2>📋 Sessions par participant</h2>
            <table>
                <thead>
                    <tr>
                        <th>Participant</th>
                        <th>Session</th>
                        <th>Événements</th>
                        <th>Pages</th>
                        <th>Clics</th>
                        <th>Début</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="sessionsTable">
                    <tr><td colspan="7" class="empty">Connectez-vous avec votre clé API</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 🔧 Script externe séparé du HTML — compatible CSP -->
    <script src="admin.js"></script>
</body>
</html>
