<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire — Étude Navigation Web</title>
<link rel="stylesheet" href="/questionnaire/style.css">
</head>
<body>

    <!-- Barre de progression -->
    <div class="progress-bar hidden" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
    </div>

    <!-- Timer -->
    <div class="timer hidden" id="timer">00:00</div>

    <!-- Conteneur principal -->
    <div class="container" id="app"></div>

    <!-- Ordre important : locales -> questions -> app -->
    <script src="/questionnaire/locales.js"></script>
    <script src="/questionnaire/questions.js"></script>
    <script src="/questionnaire/app.js"></script>
</body>
</html>
